plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

/*
 * jlayer is the pure Java mp3 decoder that turns what EdgeTTS streams (mp3 - the service only offers
 * mp3 or WebM/Opus, measured) into the PCM BBS can play. It is embedded into the mod jar below rather
 * than declared as a runtime dependency, because Fabric cannot nest a plain library jar and asking
 * users to drop a second jar into mods/ is not something people would get right.
 */
configurations {
	embed
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	/* 26.3: the game ships unobfuscated, so there is no mappings line and the loader /
	 * Fabric API go in as plain `implementation` (no remapping step). */
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	/* BBS mod - the host mod this addon plugs into.
	 * Pinned to the exact 26.3 jar (BBS FS fork, 2.3.2-26.3) so the compiled addon matches what the
	 * user actually runs. The jar is git-ignored (third-party binary); see README. */
	implementation files("libs/bbs-${project.bbs_version}.jar")

	/* mp3 decoding for the EdgeTTS backend (LGPL-2.1; embedded into the jar by the `jar` task). */
	implementation files("libs/jlayer-${project.jlayer_version}.jar")
	embed files("libs/jlayer-${project.jlayer_version}.jar")

	/* Pure Java unit tests for the EdgeTTS request/cache key and the SSML layer (no Minecraft needed). */
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// MC 26.3 requires Java 25 (was 17 on 1.20.4).
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}

	/* jlayer, shaded in. Signature files are dropped: a leftover .SF from a signed jar makes the
	 * Fabric loader refuse the whole mod as tampered. */
	from(configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }) {
		exclude "META-INF/MANIFEST.MF"
		exclude "META-INF/*.SF"
		exclude "META-INF/*.DSA"
		exclude "META-INF/*.RSA"
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
