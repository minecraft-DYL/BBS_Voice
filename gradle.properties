# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Branch = version: this branch (main) targets Minecraft 1.20.4.
# The fabric-26.3 branch targets 26.3 and has its own toolchain (see README 8).
#
# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.4
yarn_mappings=1.20.4+build.1
loader_version=0.15.11

# Mod Properties
mod_version=1.0
maven_group=com.bbsvoice
archives_base_name=bbsvoice

# Dependencies
fabric_version=0.91.1+1.20.4
# BBS mod (the host mod this addon extends), supplied as a local jar: libs/bbs-<bbs_version>.jar
# It is a third-party binary and is not in this repo - see README 8.
bbs_version=2.3-1.20.4
# Pure Java mp3 decoder, embedded into the mod jar (see build.gradle).
jlayer_version=1.0.1.4
