# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties —— MC 26.3「Wilderness Bound」(日期式版本号, 2026-09-15 发布)
# 26.3 起 Mojang 直接发布未混淆的 jar, Fabric 不再有 intermediary/yarn,
# 所以 build.gradle 里没有 mappings 一行, 依赖也用 implementation 而不是 modImplementation。
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.4

# Mod Properties
mod_version=1.1
maven_group=com.bbsvoice
archives_base_name=bbsvoice

# Dependencies
fabric_version=0.162.0+26.3
# BBS mod (the host mod this addon extends). 26.3 build, published on Modrinth 2026-10-11.
bbs_version=2.3.2-26.3
# Pure Java mp3 decoder, embedded into the mod jar (see build.gradle).
jlayer_version=1.0.1.4
